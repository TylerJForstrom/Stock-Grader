[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-grader"
version = "0.1.0"
description = "Grade a stock A+..F from fundamentals, statistics, and risk — with pluggable weighting methods at every level"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler Forstrom" }]
requires-python = ">=3.11"
keywords = ["finance", "investing", "stocks", "sec", "edgar", "xbrl", "factor-investing", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "requests>=2.31",
    "rich>=13.0",
    # Both price caches write parquet. Without an engine every write raised, the failure was
    # swallowed at DEBUG level, and every run silently re-downloaded.
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/TylerJForstrom/Stock-Grader"
Repository = "https://github.com/TylerJForstrom/Stock-Grader.git"
Issues = "https://github.com/TylerJForstrom/Stock-Grader/issues"
Security = "https://github.com/TylerJForstrom/Stock-Grader/security/policy"

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "mypy>=1.8",
    "pandas-stubs",
    "pip-audit>=2.7",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
    "types-requests",
]

[project.scripts]
stock-grader = "stock_grader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_grader = ["py.typed", "config/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["stock_grader"]

[tool.coverage.report]
# This is a blocking ratchet set below the measured 59% baseline. Raise it as the new research,
# valuation, and CLI surfaces gain tests; never lower it to merge a change.
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PERF",      # performance
    "ISC",       # implicit string concat
    "PL",        # pylint subset
]
ignore = [
    # Financial reporting periods are calendar dates, not instants; attaching a timezone to a
    # fiscal quarter end would imply a precision the filings do not have.
    "DTZ",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # metric functions legitimately branch a lot
    "PLR2004",  # named constants for every threshold would hurt readability of formulas
    "E501",     # line length is enforced by the formatter, not the linter
    # Em dashes and en dashes in reports and docstrings are deliberate typography.
    "RUF001", "RUF002", "RUF003",
    "SIM102", "SIM108",  # nested ifs are often clearer than the collapsed form here
    "B007",              # `for _ in range(n)` retry loops read fine
    "PERF102", "RUF005", # micro-optimisations that hurt readability
    "RUF046",            # int(round(x)) is deliberate: numpy round can return a numpy float
    "UP042",             # (str, Enum) stays for 3.11 compatibility with StrEnum semantics
    "SIM105", "ISC003", "PLW2901", "RUF043",
    # Lazy imports are deliberate: they break import cycles between the metric modules and keep
    # sklearn out of the import path for anyone not using the supervised weighting methods.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415"]   # magic numbers and local imports are fine in tests
"scripts/*" = ["PLC0415"]

[tool.mypy]
# Deliberately unset python_version: numpy's bundled stubs use 3.12+ syntax, so pinning to the
# package's 3.11 floor makes mypy fail parsing them before it reaches any of this code. Runtime
# support is still 3.11+, which CI verifies by actually running the suite on each version.
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
