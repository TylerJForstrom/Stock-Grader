name: monthly-freeze

on:
  schedule:
    - cron: "19 13 1 * *"   # 1st of each month: freeze the forward score panel
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Report runner disk before SEC bulk archive
        run: df -h

      - name: Freeze scores (bundled universe, every profile)
        env:
          STOCK_GRADER_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          # Fail fast rather than degrade to a placeholder SEC User-Agent: an
          # empty contact is impolite to SEC and violates this repo's own
          # contact policy.
          if [ -z "$STOCK_GRADER_CONTACT" ]; then
            echo "STOCK_GRADER_CONTACT is empty: set the SEC_CONTACT_EMAIL repository secret to a real contact address before running the freeze." >&2
            exit 1
          fi
          # One SEC fetch, one snapshot build, a panel per profile: the extra
          # profiles are free in network terms and multiply the forward evidence.
          stock-grader freeze --all-profiles --universe config/universe_default.txt --out frozen_scores
      - name: Freeze wide SEC-float universe (fundamentals-first)
        # Runs even if the narrow freeze refused, so one profile's refusal on one
        # universe cannot cost the other universe a whole month of forward evidence.
        if: always()
        env:
          STOCK_GRADER_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          # The public workflow cannot read the private vault. SEC insider prices
          # remain sparse, so price-defined profiles may refuse under the existing
          # alarm policy; their gates are intentionally not weakened here.
          # If this ever exceeds budget, shard by profile while retaining the
          # full cross-section in every job. Never shard by ticker: each shard
          # would normalize against a different peer set.
          # The pointer names the newest quarterly regeneration; the dated
          # files themselves are immutable. Refuse a pointer at a missing file
          # rather than freezing against nothing.
          WIDE="config/$(cat config/universe_wide_current)"
          [ -f "$WIDE" ] || { echo "::error::universe pointer names missing file $WIDE"; exit 1; }
          stock-grader freeze \
            --all-profiles \
            --universe "$WIDE" \
            --out frozen_scores_wide \
            --bulk-facts auto \
            --price-provider sec

      - name: Commit
        # Every scheduled workflow in this ecosystem commits under `if: always()`,
        # and this one must too. cmd_freeze refuses a profile BEFORE writing its
        # parquet and writes each panel atomically (tmp + replace), so there is no
        # such thing as a partial panel for this step to publish. What a skipped
        # commit does destroy is real: both freeze steps write their valid panels
        # to disk before the alarm policy runs, so a single profile exiting 2 —
        # and all nine wide profiles now have a prior panel, which makes any
        # refusal a regression and therefore exit 2 — discards every good panel
        # from that run. Frozen panels are point-in-time evidence that cannot be
        # backfilled; the run still reports red, which is the alarm.
        if: always()
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ -z "$GITHUB_REF_NAME" ]; then
            echo "monthly-freeze can only commit to the branch that triggered the run" >&2
            exit 1
          fi
          target_branch="$GITHUB_REF_NAME"
          remote_ref="refs/remotes/origin/$target_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frozen_scores frozen_scores_wide
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "freeze: $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$target_branch:$remote_ref" || exit 1
            git rebase "$remote_ref" || exit 1
            if git push origin "HEAD:refs/heads/$target_branch"; then exit 0; fi
          done
          exit 1
