name: quarterly-universe

# The wide universe is a dated, immutable artifact with a spec-declared
# quarterly rebuild cadence — and its dated file hard-expires 365 days after
# its asof, at which point the wide freeze dies loudly. This is the cadence.
#
# asof is TWO days back: emission refuses an archive generated before EDGAR
# stopped accepting filings dated asof (asof+1 at 03:00 UTC), and the daily
# Companyfacts generation lands ~16:20 UTC, so yesterday's asof would race it.

on:
  schedule:
    - cron: "29 9 5 2,5,8,11 *" # 5th of Feb/May/Aug/Nov, 09:29 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarterly-universe

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the public foundry (symbol directories + events)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TylerJForstrom/Stock-Data
          path: foundry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Generate the dated universe under spec v2
        env:
          STOCK_GRADER_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          if [ -z "$STOCK_GRADER_CONTACT" ]; then
            echo "STOCK_GRADER_CONTACT is empty: set SEC_CONTACT_EMAIL before regenerating." >&2
            exit 1
          fi
          # Derive asof from the archive's OWN generation instant, not the
          # calendar: the guard requires generation >= asof+1 03:00 UTC, and SEC
          # generates at varying times (measured 16:18 UTC weekdays, 04:38 UTC
          # on a weekend) — a fixed calendar offset raced it and lost.
          ASOF=$(python - <<'EOF'
          import datetime as dt
          from email.utils import parsedate_to_datetime

          from stock_grader.data.sec import SECClient
          from stock_grader.data.sec_bulk import SECBulkFacts

          bulk = SECBulkFacts(SECClient())
          if bulk.ensure() is None:
              raise SystemExit("SEC bulk archive unavailable")
          generated = parsedate_to_datetime(bulk.provenance()["last_modified"])
          if generated.tzinfo is None:
              generated = generated.replace(tzinfo=dt.UTC)
          admissible = (generated - dt.timedelta(hours=3)).date() - dt.timedelta(days=1)
          print(admissible.isoformat())
          EOF
          )
          echo "asof=$ASOF (max admissible for this archive generation)"
          python scripts/generate_sec_float_universe.py \
            --stock-data foundry \
            --spec config/universe_spec_v2.json \
            --asof "$ASOF" \
            --out-dir config \
            --sizes 1000 \
            --contact "$STOCK_GRADER_CONTACT"
          # The membership file must satisfy the same loader the freeze uses.
          COUNT=$(python -c "import sys; sys.path.insert(0,'src'); from stock_grader.cli import _load_universe; print(len(_load_universe('config/universe_liq1000_$ASOF.txt')))")
          [ "$COUNT" = "1000" ] || { echo "::error::loader count $COUNT != 1000"; exit 1; }
          # Advance the pointer the monthly freeze resolves. The dated artifacts
          # stay immutable; only the pointer moves, and only after emission and
          # the loader check both succeeded.
          echo "universe_liq1000_$ASOF.txt" > config/universe_wide_current

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/universe_liq*.txt config/universe_drops_*.json config/universe_wide_current
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "universe: $(date -u +%Y-%m) quarterly regeneration"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
