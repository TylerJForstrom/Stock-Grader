name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The repository-wide pass landed, so these three are real gates. There is no longer a
      # "hardened surface" subset: the narrow lint/format/type steps that used to run first
      # were strict subsets of these commands, kept blocking only because the wide versions
      # could not be. Keeping them would re-run the same tools over the same files.
      #
      # Nothing below is allowed to go continue-on-error again. A step that fails on every
      # run reports nothing, and the whole point of this workflow is that a red check means
      # a real regression.
      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      # Runs on every matrix entry on purpose, not once. pyproject deliberately leaves
      # python_version unset, so mypy resolves numpy's and pandas' stubs against whichever
      # interpreter is running — and those stubs genuinely disagree between versions. With
      # warn_unused_ignores on, a `# type: ignore` that 3.12 needs is an ERROR on 3.11 for
      # being unused, which is how this step first went red. Verified clean on 3.11, 3.12
      # and 3.13. Prefer typing.cast over `# type: ignore` for a stub gap: a cast cannot go
      # stale on one version while staying necessary on another.
      - name: Type check
        run: mypy --no-incremental

      # The suite is deliberately offline: tests build fixtures, so CI never depends on SEC, FRED,
      # or a market-data endpoint being reachable. The coverage ratchet lives in exactly one
      # place — [tool.coverage.report] fail_under in pyproject.toml, which pytest-cov enforces
      # without a --cov-fail-under flag here (previously the two copies drifted: this file said
      # 70 against a measured 75, pyproject's comment still said 59). The ratchet must move
      # upward as newer modules gain coverage; see pyproject for the current measurement.
      - name: Test
        run: >-
          pytest -q
          --cov=stock_grader
          --cov-report=term-missing
          --cov-report=xml

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          stock-grader --help
          python -c "from importlib.resources import files; import stock_grader; assert files('stock_grader').joinpath('config/universe_default.txt').is_file()"

  security:
    name: Dependency and source security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools and runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit bandit

      - name: Audit dependencies
        run: pip-audit

      - name: Scan Python source (medium/high severity)
        run: bandit -q -r -ll src scripts

      # Low severity is the one category this pass did NOT drive to zero, and the reason is
      # deliberate: the 19 findings are 12 asserts, a subprocess call for the git commit, a
      # non-crypto RNG for the bootstrap, and a string literal misread as a password. Each
      # needs its own security judgement — in particular whether any assert is load-bearing
      # under `python -O` — and blanket '# nosec'-ing the file would be exactly the kind of
      # suppression the rest of this pass removed.
      #
      # So it stays advisory, but it is no longer unfalsifiable: the ratchet records the
      # count per rule and FAILS if any rule grows. It also fails if a count drops without
      # the baseline being tightened, so the number can only move down. This step blocks.
      - name: Scan Python source (low severity, ratcheted)
        run: python scripts/bandit_ratchet.py
