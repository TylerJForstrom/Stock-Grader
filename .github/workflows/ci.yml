name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (hardened surface)
        run: >-
          ruff check
          src/stock_grader/data/prices.py
          src/stock_grader/data/sec_prices.py
          src/stock_grader/weighting.py
          tests/test_production_hardening.py

      - name: Lint (repository debt, advisory)
        continue-on-error: true
        run: ruff check src tests scripts

      - name: Format check (hardened surface)
        run: >-
          ruff format --check
          src/stock_grader/data/prices.py
          src/stock_grader/data/sec_prices.py
          src/stock_grader/weighting.py
          tests/test_production_hardening.py

      # Existing files predate the formatter baseline. Keep the debt visible without knowingly
      # making every branch red; remove continue-on-error once the repository-wide pass lands.
      - name: Format check (repository debt, advisory)
        continue-on-error: true
        run: ruff format --check src tests scripts

      - name: Type check (hardened surface)
        run: >-
          mypy --no-incremental --follow-imports=skip
          src/stock_grader/data/prices.py
          src/stock_grader/data/sec_prices.py
          src/stock_grader/weighting.py

      # The global annotation baseline still contains known debt. This remains explicit and
      # visible while new production-hardening code is blocked on its clean subset above.
      - name: Type check (repository debt, advisory)
        continue-on-error: true
        run: mypy --no-incremental

      # The suite is deliberately offline: tests build fixtures, so CI never depends on SEC, FRED,
      # or a market-data endpoint being reachable. The 55% ratchet is below the measured 59%
      # baseline and must move upward as newer modules gain coverage.
      - name: Test
        run: >-
          pytest -q
          --cov=stock_grader
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=55

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          stock-grader --help
          python -c "from importlib.resources import files; import stock_grader; assert files('stock_grader').joinpath('config/universe_default.txt').is_file()"

  security:
    name: Dependency and source security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools and runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-audit bandit

      - name: Audit dependencies
        run: pip-audit

      - name: Scan Python source (medium/high severity)
        run: bandit -q -r -ll src scripts

      # Low-severity findings remain visible without equating them to exploitable release blockers.
      - name: Scan Python source (low severity, advisory)
        continue-on-error: true
        run: bandit -q -r src scripts
