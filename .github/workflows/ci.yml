name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy || true   # advisory until the annotations are complete

      # The suite is deliberately offline: every test builds its own fixtures, so CI never
      # depends on SEC, FRED or any other endpoint being reachable.
      - name: Test
        run: pytest -q --cov=stock_grader --cov-report=term-missing
