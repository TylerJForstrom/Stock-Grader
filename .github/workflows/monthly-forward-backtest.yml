name: monthly-forward-backtest

# The evidence loop: join frozen panels to realized returns and evaluate them.
# Runs on the 6th, after the 5th's vault collector commit (23:22 UTC weekdays),
# so the freshest EOD day is at most one session old when maturity is checked.
#
# The built panels embed per-row returns derived from Massive free-tier closes
# and stockanalysis.com delisted histories (both restricted), so panel files are
# archived to the PRIVATE vault and only aggregate statistics — the backtest
# markdown, the build accounting, the ledger line — are committed here.

on:
  schedule:
    - cron: "41 2 6 * *"
  workflow_dispatch:
    inputs:
      profiles:
        description: "space-separated profiles (blank = every frozen profile)"
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-forward-backtest

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the private vault (EOD archive + panel archive)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TylerJForstrom/Stock-Vault
          token: ${{ secrets.VAULT_REPO_TOKEN }}
          path: vault
          # Never write the vault token into vault/.git/config, where every
          # later step (and anything those steps execute) could read it. The
          # commit step is the only consumer and supplies it per-command.
          persist-credentials: false
      - name: Check out the public foundry (split confirmation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TylerJForstrom/Stock-Data
          path: foundry
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Refuse to append to a broken ledger chain
        id: chain
        run: >-
          python -c "import sys;
          from stock_grader.research_manifest import load_manifest, summarize_manifest;
          s = summarize_manifest(load_manifest('research_ledger.jsonl'));
          print(s);
          sys.exit(0 if s['all_integrity_ok'] and s['chain_ok'] else 1)"

      - name: Cadence self-gate (last month must be accounted for)
        # Expectation clock, not an age clock: --pre-run holds the accounting
        # clock to the PREVIOUS month because this very run writes the current
        # month's artifact. Red here means a whole month of the loop went
        # missing — the failure email is the alert (collectors.yml pattern),
        # and the build step below still runs and self-heals by writing THIS
        # month's accounting. Bootstrap-guarded until the first artifact lands.
        run: stock-grader check-cadence --repo-root . --pre-run

      - name: Build and evaluate every profile
        # Runs even when the cadence gate is red (self-heal), but never after
        # a broken ledger chain — a chain failure must stop every append.
        if: ${{ !cancelled() && steps.chain.outcome == 'success' }}
        # set -uo pipefail without -e: one refusing profile must not suppress
        # the others, mirroring cmd_freeze's refused-list policy.
        run: |
          set -uo pipefail
          # Dated artifacts are immutable: an identical re-run is a no-op, a
          # DIFFERENT result under the same name is a refusal, never a silent
          # overwrite. (The evaluator is seeded, so a benign re-run reproduces
          # byte-identical markdown and this stays quiet.)
          _immutable_place() {
            src="$1"; dest="$2"
            if [ -e "$dest" ]; then
              if cmp -s "$src" "$dest"; then
                echo "::notice::$dest already written with identical content; leaving it"
                return 0
              fi
              echo "::error::$dest already exists with DIFFERENT content — dated forward artifacts are immutable; refusing to overwrite"
              return 1
            fi
            cp "$src" "$dest"
          }
          MONTH=$(date -u +%Y-%m); OUT="docs/forward/$MONTH"; mkdir -p build/panels "$OUT"
          STATES="build/panel_states.tsv"; : > "$STATES"
          PROFILES="${{ github.event.inputs.profiles }}"
          [ -z "$PROFILES" ] && PROFILES=$(ls frozen_scores)
          failed=0
          for p in $PROFILES; do
            stock-grader build-panel --profile "$p" --frozen-root frozen_scores \
              --vault vault --foundry foundry --out build/panels \
              --archive-dir vault/data/backtest_panels \
              --horizon-days 21 --min-cross-section 20 --min-periods 3 \
              || { echo "::error::build-panel failed for $p"; printf '%s\trefused_build\n' "$p" >> "$STATES"; failed=1; continue; }
            ready=$(python -c "import json;print(json.load(open('build/panels/$p.build.json'))['ready_for_backtest'])")
            if [ "$ready" != "True" ]; then echo "::notice::$p not ready for backtest yet"; printf '%s\tnot_matured\n' "$p" >> "$STATES"; continue; fi
            # Pre-register the hypothesis before evaluating it (idempotent:
            # an already-declared spec appends nothing). Evaluation flags MUST
            # mirror the backtest invocation below — they are the spec. With
            # the declaration in place every scheduled re-evaluation is ONE
            # pre-registered trial, and the declared schedule discloses the
            # monthly sequential looks in the ledger itself.
            stock-grader ledger-declare "build/panels/$p.parquet" --ledger research_ledger.jsonl \
              --periods-per-year 12 --min-cross-section 20 --quantiles 5 \
              --schedule "monthly (cron 41 2 6 * *) plus explicit workflow_dispatch runs; each run is one disclosed look" \
              || { echo "::error::ledger-declare failed for $p"; printf '%s\trefused_declare\n' "$p" >> "$STATES"; failed=1; continue; }
            # --allow-unverified-panel is mandatory, not a shortcut: return_is_total
            # is honestly False in v1, so the strict contract refuses every panel.
            # The ledger line records "FAILED total_returns_attested" — which is
            # the true state of the evidence.
            # Write through a temp file, never a bare `>` redirect into the
            # dated directory. Two reasons, both about immutability:
            #  1. `>` truncates BEFORE the command runs, so a FAILING run on the
            #     6th would destroy a SUCCEEDING run's report from the 4th and
            #     commit a 0-byte evidence artifact.
            #  2. docs/forward/<month>/ is dated evidence. stock_vault's
            #     ensembles/scoreboard writers and cmd_freeze all refuse to
            #     overwrite a dated artifact with DIFFERENT content; this loop
            #     was the outlier, and accounting.json — written from this same
            #     loop — is explicitly append-per-run because a month sees more
            #     than one run.
            TMP_MD=$(mktemp)
            stock-grader backtest "build/panels/$p.parquet" --ledger research_ledger.jsonl \
              --periods-per-year 12 --min-cross-section 20 --quantiles 5 \
              --allow-unverified-panel --format md > "$TMP_MD" \
              || { echo "::error::backtest failed for $p"; rm -f "$TMP_MD"; printf '%s\trefused_backtest\n' "$p" >> "$STATES"; failed=1; continue; }
            if ! _immutable_place "$TMP_MD" "$OUT/$p.md"; then
              printf '%s\trefused_backtest\n' "$p" >> "$STATES"; failed=1; continue
            fi
            if ! _immutable_place "build/panels/$p.build.json" "$OUT/$p.build.json"; then
              printf '%s\trefused_backtest\n' "$p" >> "$STATES"; failed=1; continue
            fi
            printf '%s\tevaluated\n' "$p" >> "$STATES"
          done
          # UNCONDITIONAL: every profile's state is accounted every run — the
          # loop running and nothing maturing is a recorded fact, not silence.
          # States are a closed vocabulary, so no refusal message (and no
          # licensed derived number inside one) can reach this public artifact.
          stock-grader forward-accounting --month "$MONTH" --states "$STATES" \
            --out docs/forward --event "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            || { echo "::error::forward-accounting refused"; failed=1; }
          exit $failed

      - name: Commit archived panels to the vault
        if: always()
        env:
          VAULT_REPO_TOKEN: ${{ secrets.VAULT_REPO_TOKEN }}
        run: |
          if [ ! -d vault ]; then
            echo "vault checkout absent (missing VAULT_REPO_TOKEN?); nothing to commit"
            exit 0
          fi
          # The vault checkout does not persist its token, so this step is the
          # only place the credential lives; every remote operation supplies it
          # as the same basic-auth header actions/checkout would have stored.
          # base64 -w0: the header must stay on one line.
          vault_git() {
            git -C vault -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$VAULT_REPO_TOKEN" | base64 -w0)" "$@"
          }
          # Probe push auth on every run — months where nothing matured included —
          # so an expired or revoked token turns THIS run red instead of failing
          # at archive time months later.
          vault_git push --dry-run origin HEAD:main
          if [ ! -d vault/data/backtest_panels ]; then
            echo "no panels archived this run (nothing matured); nothing to commit"
            exit 0
          fi
          git -C vault config user.name "github-actions[bot]"
          git -C vault config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C vault add -A data/backtest_panels
          if git -C vault diff --cached --quiet; then echo "nothing to commit to the vault"; exit 0; fi
          git -C vault commit -m "panels: $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            if vault_git push origin HEAD:main; then exit 0; fi
            vault_git pull --rebase origin main || exit 1
          done
          exit 1

      - name: Commit ledger and reports here
        # NEVER git add build/ — it is gitignored, which is the structural
        # guarantee that Massive-derived rows cannot reach this public repo.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/forward
          git add -A research_ledger.jsonl docs/forward
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "forward: $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
